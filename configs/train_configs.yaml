# Data
csv: captions.csv
root: D:/path/to/breaking_bad
out: ./checkpoints
val_split: 0.1

# Geometry
n_fps: 1024
disk_grid: 32
curv_channels: 6

# MAE projector
proj_hidden: 256
mae_enc_layers: 4
mae_dec_layers: 2
mae_n_heads: 4
mae_mask_ratio: 0.5
mae_lam: 0.2
mae_chunk_size: 32
max_geo_tokens: 512

# Model / LoRA
load_4bit: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Training
epochs: 5
batch: 2
grad_accum: 8
lr: 2.0e-4
proj_lr: 1.0e-3
warmup_ratio: 0.1
freeze_lm_steps: 2000
max_seq_len: 512
dataloader_workers: 2
seed: 42

# Logging
wandb: test_drive
log_steps: 20
save_steps: 1000
eval_steps: 200